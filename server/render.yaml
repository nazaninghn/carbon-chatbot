services:
  - type: web
    name: carboniq-backend
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GROQ_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: llama-3.3-70b-versatile
      - key: CHAT_TEMPERATURE
        value: "0.3"
      - key: CHAT_MAX_TOKENS
        value: "2000"
      - key: OPENAI_API_KEY
        value: MOCK_MODE
      - key: CLIENT_URL
        sync: false
